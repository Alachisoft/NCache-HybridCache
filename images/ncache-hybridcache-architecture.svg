<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fb3"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/>
    </marker>
  </defs>

  <!-- Background (keeps the diagram readable in GitHub dark mode) -->
  <rect x="0" y="0" width="1600" height="940" rx="16" fill="#ffffff"/>

  <!-- ===== Method call (left) ===== -->
  <text x="40" y="160" font-size="26" font-weight="700" fill="#222">Method call</text>
  <g font-family="Consolas, Menlo, monospace" font-size="17" fill="#666">
    <text x="50" y="218">GetOrCreateAsync</text>
    <text x="50" y="244">SetAsync</text>
    <text x="50" y="270">RemoveAsync</text>
    <text x="50" y="296">RemoveByTagAsync</text>
  </g>

  <!-- ===== Main box ===== -->
  <text x="300" y="62" font-size="28" font-weight="700" fill="#222">NCache HybridCache Implementation</text>
  <rect x="300" y="80" width="940" height="620" rx="14" fill="#fafafa" stroke="#333" stroke-width="3"/>

  <!-- Method-call arrow (drawn over the box border) -->
  <line x1="40" y1="180" x2="378" y2="180" stroke="#333" stroke-width="3" marker-end="url(#arrowDark)"/>

  <!-- L1 -->
  <rect x="380" y="150" width="380" height="100" rx="10" fill="#e8f1fb" stroke="#2f6fb3" stroke-width="2.5"/>
  <text x="570" y="193" font-size="24" font-weight="700" fill="#1d4f86" text-anchor="middle">L1 · NCache In-Proc Cache</text>
  <text x="570" y="223" font-size="16" fill="#3b5f86" text-anchor="middle">in-memory, inside each app server</text>

  <!-- L2 -->
  <rect x="380" y="330" width="380" height="100" rx="10" fill="#fdf0e1" stroke="#d9822b" stroke-width="2.5"/>
  <text x="570" y="373" font-size="24" font-weight="700" fill="#8a4b10" text-anchor="middle">L2 · NCache Distributed Cache</text>
  <text x="570" y="403" font-size="16" fill="#8a5a2b" text-anchor="middle">shared by all app servers</text>

  <!-- Factory -->
  <rect x="380" y="520" width="380" height="90" rx="10" fill="#e8f1fb" stroke="#2f6fb3" stroke-width="2.5"/>
  <text x="570" y="560" font-size="24" font-weight="700" fill="#1d4f86" text-anchor="middle">Factory</text>
  <text x="570" y="588" font-size="16" fill="#3b5f86" text-anchor="middle">your data-loading code</text>

  <!-- Pub/Sub -->
  <rect x="900" y="290" width="300" height="180" rx="10" fill="#fdf0e1" stroke="#d9822b" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="1050" y="365" font-size="26" font-weight="700" fill="#8a4b10" text-anchor="middle">NCache Pub/Sub</text>
  <text x="1050" y="397" font-size="17" fill="#8a5a2b" text-anchor="middle">built-in L1 sync</text>
  <text x="1050" y="421" font-size="17" fill="#8a5a2b" text-anchor="middle">no extra message broker</text>

  <!-- ===== Read / write flow arrows ===== -->
  <g stroke="#2f6fb3" stroke-width="3" fill="none">
    <!-- L1 -> L2 miss -->
    <line x1="490" y1="250" x2="490" y2="327" marker-end="url(#arrow)"/>
    <!-- L2 -> L1 hit -->
    <line x1="650" y1="330" x2="650" y2="253" marker-end="url(#arrow)"/>
    <!-- L2 -> Factory miss -->
    <line x1="490" y1="430" x2="490" y2="517" marker-end="url(#arrow)"/>
    <!-- Factory -> L2 store -->
    <line x1="650" y1="520" x2="650" y2="433" marker-end="url(#arrow)"/>
    <!-- Factory -> L1 store (left side loop) -->
    <polyline points="380,580 340,580 340,225 377,225" marker-end="url(#arrow)"/>
    <!-- L1 -> Value -->
    <polyline points="570,150 570,110 1557,110" stroke="#333" marker-end="url(#arrowDark)"/>
    <!-- Factory <-> Data source -->
    <line x1="520" y1="610" x2="520" y2="737" marker-end="url(#arrow)"/>
    <line x1="620" y1="740" x2="620" y2="613" marker-end="url(#arrow)"/>
  </g>
  <g font-size="17" fill="#2f6fb3" font-weight="600">
    <text x="478" y="296" text-anchor="end">miss</text>
    <text x="662" y="296">hit: copy to L1</text>
    <text x="478" y="481" text-anchor="end">miss</text>
    <text x="662" y="481">store in L2</text>
    <text x="326" y="400" text-anchor="middle" transform="rotate(-90 326 400)">store in L1</text>
    <text x="508" y="680" text-anchor="end">fetch</text>
    <text x="632" y="680">data</text>
  </g>

  <!-- Value label -->
  <text x="1557" y="92" font-size="26" font-weight="700" fill="#222" text-anchor="end">Value</text>

  <!-- ===== Publish to Pub/Sub ===== -->
  <line x1="760" y1="380" x2="897" y2="380" stroke="#d9822b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowOrange)"/>
  <text x="830" y="368" font-size="16" fill="#b5651d" font-weight="600" text-anchor="middle">publish</text>
  <text x="830" y="402" font-size="16" fill="#b5651d" font-weight="600" text-anchor="middle">after write</text>

  <!-- ===== Notifications to other app servers ===== -->
  <g stroke="#d9822b" stroke-width="3" fill="none" stroke-dasharray="8 6">
    <line x1="1200" y1="380" x2="1300" y2="380"/>
    <line x1="1300" y1="290" x2="1300" y2="470"/>
    <line x1="1300" y1="290" x2="1337" y2="290" marker-end="url(#arrowOrange)"/>
    <line x1="1300" y1="380" x2="1337" y2="380" marker-end="url(#arrowOrange)"/>
    <line x1="1300" y1="470" x2="1337" y2="470" marker-end="url(#arrowOrange)"/>
  </g>
  <text x="1450" y="214" font-size="22" font-weight="700" fill="#222" text-anchor="middle">Notifications</text>
  <text x="1450" y="240" font-size="16" fill="#666" text-anchor="middle">to other app servers</text>
  <g font-size="17" text-anchor="middle">
    <rect x="1340" y="262" width="220" height="56" rx="8" fill="#e8f1fb" stroke="#2f6fb3" stroke-width="2"/>
    <text x="1450" y="296" fill="#1d4f86" font-weight="600">App server 2 · L1</text>
    <rect x="1340" y="352" width="220" height="56" rx="8" fill="#e8f1fb" stroke="#2f6fb3" stroke-width="2"/>
    <text x="1450" y="386" fill="#1d4f86" font-weight="600">App server 3 · L1</text>
    <rect x="1340" y="442" width="220" height="56" rx="8" fill="#e8f1fb" stroke="#2f6fb3" stroke-width="2"/>
    <text x="1450" y="476" fill="#1d4f86" font-weight="600">App server N · L1</text>
  </g>
  <text x="1450" y="532" font-size="15" fill="#666" text-anchor="middle">UPDATE · REMOVE · TAG · WILDCARD</text>

  <!-- ===== Data source ===== -->
  <rect x="300" y="740" width="940" height="90" rx="12" fill="#f2f2f2" stroke="#333" stroke-width="3"/>
  <text x="770" y="780" font-size="26" font-weight="700" fill="#222" text-anchor="middle">Data source</text>
  <text x="770" y="808" font-size="17" fill="#666" text-anchor="middle">database, service, etc.</text>

  <!-- ===== Legend ===== -->
  <g font-size="16" fill="#444">
    <rect x="300" y="872" width="22" height="22" rx="4" fill="#e8f1fb" stroke="#2f6fb3" stroke-width="2"/>
    <text x="332" y="889">runs in your app process</text>
    <rect x="560" y="872" width="22" height="22" rx="4" fill="#fdf0e1" stroke="#d9822b" stroke-width="2"/>
    <text x="592" y="889">runs on the NCache cluster</text>
    <line x1="830" y1="883" x2="880" y2="883" stroke="#d9822b" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="892" y="889">L1 sync messages</text>
  </g>
</svg>
